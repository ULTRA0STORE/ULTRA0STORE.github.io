<style>
:root{--bg:#000;--card:#110709;--card2:#1c0a0d;--line:#3a1217;--main:#b3001b;--main2:#e01e37;--text:#f6ecec;--muted:#a58b8e;--sheet:#070304;--head:rgba(0,0,0,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#faf3f3;--card:#fff;--card2:#fdecee;--line:#ecc9ce;--text:#2a0b10;--muted:#7a5a5f;--sheet:#fff;--head:rgba(255,255,255,.93)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-weight:800;font-size:22px;letter-spacing:1px;color:var(--main2)}
.hbtns{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:17px}
.login{background:var(--main);color:#fff;padding:8px 14px;border-radius:12px;font-weight:600;font-size:14px;border:0;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:fixed;top:0;right:0;height:100%;width:260px;background:var(--sheet);border-left:1px solid var(--line);z-index:60;transform:translateX(100%);transition:transform .25s;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}
.menu.show{transform:none}
.menu h3{color:var(--main2);margin-bottom:14px}
.menu a,.menu .mi{display:block;width:100%;text-align:right;background:none;border:0;color:var(--text);padding:12px 6px;border-bottom:1px solid var(--line);font-size:15px}
.slider{max-width:900px;margin:12px auto 0;padding:0 10px}
.slider{position:relative}
.track{position:relative;aspect-ratio:16/9;max-height:460px;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#0a0003}
@media(min-width:640px){.track{aspect-ratio:2/1}}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(135deg,var(--main),#4a000b);color:#fff;text-decoration:none;cursor:pointer}
.slide.on{opacity:1;pointer-events:auto}
.slide b{font-size:clamp(18px,5vw,28px);font-weight:800;line-height:1.6}
.slide small{display:block;font-size:clamp(12px,3.4vw,16px);font-weight:600;opacity:.85}
.slide.img{padding:0;background:#0a0003}
.slide.img img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots button{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.3s;border:0;padding:0;position:relative}
.dots button::after{content:"";position:absolute;inset:-8px -4px}
.dots button.on{background:var(--main2);width:22px;border-radius:6px}
.ticker{max-width:900px;margin:10px auto 0;overflow:hidden;border-block:1px solid var(--line);background:var(--card);padding:7px 0}
.ticker span{display:inline-block;white-space:nowrap;color:var(--main2);font-weight:700;font-size:14px;animation:tick 22s linear infinite}
@keyframes tick{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.social{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap;padding:0 10px}
.social a{background:var(--card);border:1px solid var(--line);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:.2s}
.social a:hover{background:var(--main);color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:12px 10px 90px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font-size:14px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--main2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.grid{gap:16px}}
.cat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;text-align:center;cursor:pointer;transition:.25s;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cat:hover,.cat:focus-visible{transform:translateY(-4px);border-color:var(--main2);box-shadow:0 8px 24px rgba(224,30,55,.25);outline:0}
.ico{width:88%;aspect-ratio:1/1;margin:0 auto 10px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,var(--main),#6d0010)}
.cat h3{font-size:14px;font-weight:800;line-height:1.5}
.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:70;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.overlay.mid{align-items:center;padding:20px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:700px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .25s ease;color:var(--text)}
.mid .sheet{border-radius:24px;max-width:380px;text-align:center}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{font-size:20px}
.close{background:var(--card);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;margin-bottom:8px;text-align:center;line-height:1.9}
.items{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item .name{font-weight:600;font-size:15px}
.btns{display:flex;gap:6px}
.buy{border:0;padding:9px 12px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap;color:#fff;display:inline-block;text-align:center}
.wa{background:var(--main)}
.tg{background:#2a2a2a;border:1px solid var(--line)}
.group{margin:16px 0 8px;font-weight:800;color:var(--main2);font-size:16px}
.pop p{color:var(--muted);line-height:1.9;margin:6px 0 14px;font-size:14px}
.pop .buy{display:block;width:100%;padding:12px;margin-top:8px;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
.tabs button.on{background:var(--main);border-color:var(--main);color:#fff}
.field{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:600}
.field input{display:block;width:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:15px;outline:none}
.field input:focus{border-color:var(--main2)}
.err{color:var(--main2);font-size:13px;min-height:20px;margin-bottom:6px;font-weight:600}
.submit{width:100%;padding:13px;font-size:15px;background:var(--main);border:0;border-radius:12px;color:#fff;font-weight:800}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:16px;z-index:45;width:54px;height:54px;border-radius:50%;background:var(--main);color:#fff;border:0;font-size:24px;box-shadow:0 6px 20px rgba(224,30,55,.45)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--main2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;z-index:90;display:none;max-width:90%;text-align:center}
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none;padding:env(safe-area-inset-top,0px) 0 calc(90px + env(safe-area-inset-bottom,0px))}
.page.show{display:block}
.pgbar{display:flex;align-items:center;gap:10px;padding:16px 14px 8px;max-width:900px;margin:0 auto}
.pgbar h2{font-size:22px;font-weight:800}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:22px;line-height:1}
.pgbody{max-width:900px;margin:0 auto;padding:8px 14px}
.pgbody .search{border-radius:999px;margin-bottom:18px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.tile{background:none;border:0;color:var(--text);text-align:center;font-weight:700;font-size:14px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .ico{width:100%;margin:0;font-size:40px;overflow:hidden;border:1px solid var(--line);
background:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%) 0 0/30px 30px,linear-gradient(135deg,#d3112b,#7a0010)}
.tile .ico img{width:100%;height:100%;object-fit:cover}
.tile:hover .ico,.tile:focus-visible .ico{border-color:var(--main2);box-shadow:0 8px 24px rgba(224,30,55,.3);outline:0}
.tile.off{opacity:.45;filter:grayscale(1);cursor:not-allowed}
.tile.off:hover .ico{box-shadow:none;border-color:var(--line)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px 40px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none}.slide{transition:none}}
.fabmenu{position:fixed;left:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:45;display:none;flex-direction:column;gap:8px}
.fabmenu.show{display:flex}
.fabmenu a{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:8px 14px 8px 10px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fabmenu i{font-style:normal;font-size:18px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.pcard{background:none;border:0;color:var(--text);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.pcard .pimg{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);font-size:36px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d3112b,#7a0010)}
.pcard.sel .pimg{border-color:var(--main2)}
.pcard img{width:100%;height:100%;object-fit:cover}
.pcard .pn{font-size:12.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pp{font-size:13px;color:var(--muted);font-weight:700}
.buybox{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.buybox .tot{font-weight:800}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.fabmenu{bottom:calc(156px + env(safe-area-inset-bottom,0px))}

.bnav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(94%,520px);z-index:42;display:flex;justify-content:space-around;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:30px;padding:8px 4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.bnav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;padding:2px 8px;font-family:inherit}

.pwabar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:43;display:none;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--main2);border-radius:999px;padding:5px 6px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.pwabar.show{display:flex}
.pwabar .pi{background:var(--main);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:800;font-family:inherit;font-size:13px}
.pwabar .px{background:none;border:0;color:var(--muted);padding:0 10px;font-size:15px}
.dbody{padding:0 14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.dcard h3{font-size:17px;margin:0 0 10px}.dcard h3 small{color:var(--muted);font-weight:600;font-size:13px}
.dcard p{margin:8px 0;line-height:1.7;font-size:14px}
.dhero{text-align:center}.dhero h2{font-size:24px;margin:8px 0}
.dhero .dimg{width:170px;height:170px;border-radius:26px;margin:0 auto 10px;background:linear-gradient(135deg,#d3112b,#6a000f);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 44px rgba(224,30,55,.35)}
.dhero .dimg img{width:100%;height:100%;object-fit:cover;background:#fff}.mi{font-size:64px}
.badge,.pill{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid var(--main2);color:#ff4d63;font-size:13px;font-weight:800}
.pill.gold{border-color:#d9a300;color:#f2b500;background:rgba(217,163,0,.12)}.pill.blue{border-color:#4da3ff;color:#4da3ff}.pill.green{border-color:#10d98a;color:#10d98a}.pill.red{border-color:#ff4d63;color:#ff4d63}
.blue{color:#4da3ff}.red{color:#ff4d63}.gold{color:#f2b500}.gr{color:#10d98a}
.dnote{margin:0;padding:0 18px 0 0;color:var(--muted);line-height:1.9;font-size:14px}

.amt span{color:var(--muted);font-weight:800}.amt input{flex:1;background:none;border:0;color:var(--text);font-size:18px;padding:15px 0;outline:none;font-family:inherit}

.submit{background:var(--main);color:#fff;border:0}.cancel{background:none;border:1px solid var(--main2);color:#ff4d63}

.qr{display:block;width:210px;height:210px;margin:12px auto;border-radius:16px;background:#fff}
.tcard{text-align:center}.ring{position:relative;width:200px;height:200px;margin:4px auto 12px}

.dcard input#dTx{width:100%;box-sizing:border-box;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:15px;color:var(--text);font-size:16px;font-family:inherit;outline:none}

.ic{flex:none;vertical-align:middle}

.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center}

img,svg,video{max-width:100%}

/* ===== ضبط الأحجام (عدّل الأرقام من هون) ===== */
:root{--slider-ratio:2/1;--slider-max:240px;--cat-cols:3;--cat-gap:10px}
@media(min-width:640px){:root{--slider-ratio:2.6/1;--slider-max:320px;--cat-cols:4}}
.slider{margin-top:10px}
.track{aspect-ratio:var(--slider-ratio);max-height:var(--slider-max);border-radius:16px}
.grid{grid-template-columns:repeat(var(--cat-cols),minmax(0,1fr));gap:var(--cat-gap)}
.cat{min-height:0;padding:8px 8px 10px;gap:8px;justify-content:flex-start;border-radius:16px}
.cat .ico{width:100%;margin:0;border-radius:12px}
.cat .ico svg{width:42%;height:42%;color:#fff}
.cat h3{font-size:13px;line-height:1.4}

  track.appendChild(d);
  const dot = document.createElement("button"); dot.type = "button"; dot.setAttribute("aria-label","شريحة "+(i+1));
  dot.className = i?"":"on"; dot.onclick = ()=>{ go(i); play(); }; dots.appendChild(dot);

function go(n){
  const N = slides.length; n = (n+N)%N;
  track.children[cur].classList.remove("on"); track.children[cur].setAttribute("aria-hidden","true"); dots.children[cur].classList.remove("on");
  cur = n;
  track.children[cur].classList.add("on"); track.children[cur].setAttribute("aria-hidden","false"); dots.children[cur].classList.add("on");
}
function play(){ clearInterval(timer); if(document.hidden || matchMedia("(prefers-reduced-motion:reduce)").matches) return; timer = setInterval(()=>go(cur+1), 5000); }
track.onkeydown = e => { if(e.key==="ArrowLeft"){ go(cur+1); play(); } if(e.key==="ArrowRight"){ go(cur-1); play(); } };
let sx = 0, sy = 0, down = false;
track.addEventListener("pointerdown", e=>{ down = true; moved = false; sx = e.clientX; sy = e.clientY; clearInterval(timer); });
track.addEventListener("pointermove", e=>{ if(down && Math.abs(e.clientX-sx) > 12 && Math.abs(e.clientX-sx) > Math.abs(e.clientY-sy)) moved = true; });
const endDrag = e=>{
  if(!down) return; down = false;
  const dx = e.clientX - sx;
  if(moved && Math.abs(dx) > 40){ go(dx>0 ? cur+1 : cur-1); }
  setTimeout(()=>{ moved = false; }, 60); play();
};
track.addEventListener("pointerup", endDrag);
track.addEventListener("pointercancel", ()=>{ down = false; moved = false; play(); });
track.addEventListener("click", e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); } }, true);
track.addEventListener("mouseenter", ()=>clearInterval(timer));
track.addEventListener("mouseleave", play);
document.addEventListener("visibilitychange", play);
play();

  let kids = cur ? tree.filter(c=>c.parent_id===cur.id) : legacy();

}

  };
  $("authForm").onsubmit = async e => {
    e.preventDefault();
    const email = $("aEmail").value.trim().toLowerCase(), pass = $("aPass").value, err = $("aErr");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "اكتب بريد إلكتروني صحيح"; return; }
    if(pass.length < 6){ err.textContent = "كلمة السر لازم تكون 6 أحرف أو أكثر"; return; }
    $("aSubmit").disabled = true;
    if(mode==="reg"){
      if(pass !== $("aConf").value){ err.textContent = "كلمتا السر غير متطابقتين"; $("aSubmit").disabled = false; return; }
      const {data,error} = await sb.auth.signUp({email, password:pass});
      $("aSubmit").disabled = false;
      if(error){ err.textContent = errAr(error.message); return; }
      if(!data.session){ err.textContent = "تم إنشاء الحساب، افتح بريدك وفعّل الحساب ثم سجّل دخولك"; return; }
      await loadMe(); closeSheet(); toast("تم إنشاء حسابك بنجاح");
    }else{
      const {error} = await sb.auth.signInWithPassword({email, password:pass});
      $("aSubmit").disabled = false;
      if(error){ err.textContent = errAr(error.message); return; }
      await loadMe(); closeSheet(); toast("أهلاً بعودتك");
    }
  };
}

  const pg = document.createElement("div"); pg.className = "page"; pg.id = "dep";
  pg.innerHTML = '<div class="pgbar"><button class="back" id="dBack" aria-label="رجوع">›</button><h2>إيداع الرصيد</h2></div><div id="dBody" class="dbody"></div>';
  document.body.appendChild(pg);
  let rate = 147, methods = [], timer = null, poll = null, view = "methods";
  const clr = ()=>{ clearInterval(timer); clearInterval(poll); timer = poll = null; };
  const ERR = {open_invoice:"عندك فاتورة مفتوحة، أكملها أو ألغها أولاً", below_min:"المبلغ أقل من الحد الأدنى", expired:"انتهى وقت الفاتورة", bad_tx:"اكتب رقم العملية بشكل صحيح", tx_used:"رقم العملية مستخدم من قبل", bad_state:"حالة الفاتورة تغيّرت، حدّث الصفحة"};
  const derr = m=>{ for(const k in ERR) if((m||"").includes(k)) return ERR[k]; return "صار خطأ، حاول مرة تانية"; };
  const copy = t=>{ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("تم النسخ")).catch(()=>toast("انسخه يدوياً: "+t)); };
  const mImg = m=> m.kind==="qr" ? '<img src="'+QR+'" alt="QR">' : '';
  const compress = f=>new Promise(res=>{ const im = new Image(); im.onload = ()=>{ const k = Math.min(1, 1000/Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); c.toBlob(b=>res(b),"image/jpeg",.7); URL.revokeObjectURL(im.src); }; im.onerror = ()=>res(null); im.src = URL.createObjectURL(f); });
  let proofFile = null;
  const usd = n=> "$"+Number(n).toFixed(3);

  window.openDeposit = async function(){
    if(!me) return openAuth();
    clr(); pg.classList.add("show"); pg.scrollTop = 0;
    $("dBody").innerHTML = '<div class="note">جاري التحميل...</div>';
    const [m, r, o] = await Promise.all([
      sb.from("deposit_methods").select("*").eq("active",true).order("sort"),
      sb.from("settings").select("value").eq("key","syp_rate").maybeSingle(),
      sb.from("deposits").select("*, deposit_methods(name,kind,account,min_syp)").eq("user_id",me.id).in("status",["pending","review"]).order("id",{ascending:false}).limit(1)
    ]);
    methods = m.data || []; rate = parseFloat(r.data && r.data.value) || 147;
    const d = (o.data || [])[0];
    if(d && (d.status==="review" || new Date(d.expires_at) > new Date())) return invoice(d);
    renderMethods();
  };
  window.closeDeposit = ()=>{ clr(); pg.classList.remove("show"); };
  $("dBack").onclick = ()=>{ if(view==="amount") renderMethods(); else window.closeDeposit(); };

  function renderMethods(){
    clr(); view = "methods";
    $("dBody").innerHTML = '<div class="dcard dhero"><h2>إيداع الرصيد</h2><p style="color:var(--muted)">اختر طريقة الدفع المناسبة لإتمام عملية الشحن بأمان.</p></div><div class="pgrid">'+
      methods.map(m=>'<button class="pcard" data-m="'+m.id+'"><div class="pimg"></div><div class="pn">'+esc(String(m.name).toUpperCase())+'</div></button>').join("")+'</div>';
    $("dBody").querySelectorAll(".pcard").forEach(b=>b.onclick=()=>renderAmount(methods.find(x=>x.id==b.dataset.m)));
  }

  function renderAmount(m){
    clr(); view = "amount"; const min = +m.min_syp;
    $("dBody").innerHTML =
      '<div class="dcard dhero"><div class="dimg">'+mImg(m)+'</div><h2>'+esc(String(m.name).toUpperCase())+'</h2><span class="badge">Minimum: '+min.toFixed(2)+' SYP</span></div>'+
      '<div class="dcard"><h3>ملاحظات هامة</h3><ul class="dnote"><li>ادخل المبلغ واضغط على طلب</li><li>سيتم نقلك الى صفحة التحويل</li></ul><p class="red">لا تحول قبل إنشاء الفاتورة !!<br>الطريقة تعمل بشكل يدوي وتحتاج بعض الوقت للقبول .</p><p class="gold">سعر الصرف : '+rate+' ل.س مقابل الدولار الواحد .</p></div>'+
      '<div class="dcard"><h3>المبلغ المراد دفعه</h3><div class="amt"><span>SYP</span><input id="dAmt" type="number" inputmode="decimal" placeholder="0"></div><div class="addrow"><b class="gr">سيضاف إلى رصيدك</b><b class="gr" id="dUsd">$0.000</b></div><button class="submit" id="dCreate">إنشاء فاتورة</button></div>';
    $("dAmt").oninput = ()=>{ $("dUsd").textContent = usd((+$("dAmt").value||0)/rate); };
    $("dCreate").onclick = async ()=>{
      const a = +$("dAmt").value;
      if(!(a >= min)){ toast("أقل مبلغ للإيداع "+min.toFixed(2)+" SYP"); return; }
      const b = $("dCreate"); b.disabled = true;
      const {data, error} = await sb.rpc("create_deposit", {p_method:m.id, p_amount:a});
      if(error){ b.disabled = false; toast(derr(error.message)); return; }
      const o = await sb.from("deposits").select("*, deposit_methods(name,kind,account,min_syp)").eq("id",data).maybeSingle();
      if(o.data) invoice(o.data); else window.openDeposit();
    };
  }

  function invoice(d){
    clr(); view = "invoice"; const m = d.deposit_methods || {};
    const ST = {pending:["بانتظار الدفع","gold"], review:["قيد المراجعة","blue"], done:["تم الإيداع","green"], rejected:["مرفوض","red"], cancelled:["ملغاة","red"], expired:["منتهية","red"]}[d.status] || ["",""];
    const amt = String(Number(d.amount_syp));
    const timerCard = '<div class="dcard tcard"><div class="ring"><svg viewBox="0 0 120 120"><circle class="r0" cx="60" cy="60" r="54"/><circle class="r1" id="dRing" cx="60" cy="60" r="54"/></svg><div class="tt"><b id="dTime">30:00</b><small>الوقت المتبقي</small></div></div><p style="color:var(--muted)">بعد إتمام التحويل، أدخل رقم العملية قبل انتهاء الوقت.</p></div>'+
      '<div class="dcard"><input id="dTx" dir="ltr" placeholder="رقم العملية"><label class="proof" for="dProof"><span id="dProofT">'+ico("upload",18)+' أرفق صورة إثبات الدفع</span></label><input type="file" id="dProof" accept="image/*" hidden><button class="submit" id="dDone">إتمام الطلب</button><button class="cancel" id="dCancel">إلغاء المعاملة</button></div>';
    const reviewCard = '<div class="dcard"><b>تم استلام رقم العملية</b><p style="color:var(--muted)">رقم العملية: <span dir="ltr">'+esc(d.tx_ref||"")+'</span><br>سيتم إضافة الرصيد بعد التحقق، وغالباً خلال دقائق.</p><button class="cancel" id="dClose">رجوع</button></div>';
    $("dBody").innerHTML =
      '<div class="dcard"><p class="blue">يرجى عدم مغادرة الصفحة حتى اتمام العملية</p><p>يرجى ارسال المبلغ بحيث يصلنا <b class="red">كامل المبلغ</b> المطلوب .</p></div>'+
      '<div class="dcard dhero"><span style="color:var(--muted)">فاتورة دفع</span><h2>'+esc(String(m.name||"").toUpperCase())+'</h2><span class="pill '+ST[1]+'">'+ST[0]+'</span></div>'+
      '<div class="dcard amtcard"><div class="gr">المبلغ المطلوب (اضغط للنسخ)</div><button class="big" id="dCopyAmt">'+amt+' SYP <i>'+ico("copy",20)+'</i></button><div class="gr">سيضاف إلى رصيدك: '+usd(d.amount_usd)+'</div></div>'+
      '<div class="dcard"><h3>أرقام / أكواد الإيداع <small>(اضغط للنسخ)</small></h3><p class="red">يرجى تحويل المبلغ المطلوب إلى أحد الحسابات التالية</p>'+(m.kind==="qr"?'<img class="qr" src="'+QR+'" alt="QR">':'')+'<button class="acct" id="dCopyAcct"><i>'+ico("copy",18)+'</i><span>'+esc(m.account||"")+'</span></button></div>'+
      (d.status==="pending" ? timerCard : d.status==="review" ? reviewCard : "");
    $("dCopyAmt").onclick = ()=>copy(amt); $("dCopyAcct").onclick = ()=>copy(m.account||"");
    if(d.status==="pending"){
      const end = new Date(d.expires_at).getTime(), tot = 30*60*1000;
      const tick = ()=>{
        const left = end - Date.now();
        if(left <= 0){ clr(); sb.rpc("cancel_deposit",{p_id:d.id}); toast("انتهى وقت الفاتورة"); return renderMethods(); }
        const s = Math.floor(left/1000);
        $("dTime").textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
        $("dRing").style.strokeDashoffset = String(339.3*(1-left/tot));
      };
      tick(); timer = setInterval(tick,1000);
      proofFile = null;
      $("dProof").onchange = e=>{ proofFile = e.target.files[0] || null; $("dProofT").innerHTML = proofFile ? ico("check",18)+" "+esc(proofFile.name) : ico("upload",18)+" أرفق صورة إثبات الدفع"; };
      $("dDone").onclick = async ()=>{
        const tx = $("dTx").value.trim(); if(tx.length < 4){ toast("اكتب رقم العملية"); return; }
        const b = $("dDone"); b.disabled = true;
        let path = null;
        if(proofFile){
          const blob = await compress(proofFile);
          if(!blob){ b.disabled = false; toast("تعذر قراءة الصورة"); return; }
          path = me.id+"/"+d.id+"-"+Date.now()+".jpg";
          const up = await sb.storage.from("proofs").upload(path, blob, {contentType:"image/jpeg"});
          if(up.error){ b.disabled = false; toast("تعذر رفع الصورة، حاول مرة ثانية"); return; }
        }
        const {error} = await sb.rpc("submit_deposit", {p_id:d.id, p_tx:tx, p_proof:path});

(function(){

    if(!me){ bell.style.display = "none"; return; }

  }

        if(a !== $("rp2").value){ $("rpErr").textContent = "كلمتا السر غير متطابقتين"; return; }

        if(error){ $("rpErr").textContent = errAr(error.message); return; }

      };
    }, 300);
  });

})();

(function(){
let OV = {};
if(sb) sb.from("settings").select("value").eq("key","input_types").maybeSingle().then(r=>{ try{ OV = JSON.parse(r.data.value)||{}; }catch(e){} }).catch(()=>{});
const T = {link:/رشق|متابع|سوشيال|سوشل|لايك|مشاهد|توثيق|social|follow|likes|views|instagram|انستغرام|يوتيوب|فيسبوك|تويتر/i, phone:/ارصده|رصيد|حواله|فواتير|adsl|سيريتيل|syriatel|mtn/i, none:/ارقام|رقم|number|بطاق|كارد|card|اشتراك|vpn|ذكاء|كوبون|برامج|تصميم|برمج|حسابات|بروكسي|عملات|crypto|gift/i};
function typeFor(cat){
  const chain = []; let c = cat;
  while(c){ if(OV[c.id]) return OV[c.id]; chain.push(c); c = tree.find(x=>x.id===c.parent_id); }
  const root = chain[chain.length-1];
  if(!root.supplier_id) return "id";
  const gr = rootFor("الألعاب"), ar = rootFor("التطبيقات");
  if((gr && gr.id===root.id) || (ar && ar.id===root.id)) return "id";
  const n = norm(chain.map(x=>x.name).join(" "));
  for(const k of ["link","phone","none"]) if(T[k].test(n)) return k;
  return "id";
}
const _oc2 = openContact; openContact = async function(cat){ window.__cat = cat; return _oc2(cat); };
const L = {id:["رقم اللاعب (ID)","اكتب الـ ID هنا"], link:["الرابط","الصق الرابط هنا https://"], phone:["رقم الهاتف","اكتب الرقم هنا"]};
new MutationObserver(()=>{
  const p = $("pid"); if(!p || p.dataset.t || !window.__cat) return;
  const t = typeFor(window.__cat); p.dataset.t = t; const lab = p.parentElement, box = $("buybox");
  if(t=="none"){ p.value = "-"; lab.style.display = "none"; }
  else { lab.firstChild.nodeValue = L[t][0]; p.placeholder = L[t][1]; p.inputMode = t=="link" ? "url" : t=="phone" ? "tel" : "text"; }
  if(box && !box._v){ box._v = 1; box.addEventListener("click",e=>{
    const q = $("pid"); if(!q || q.dataset.t!="link" || !e.target.closest("#goBuy,#addCart")) return;

  }, true); }
}).observe($("sheetBody"),{childList:true,subtree:true});
