<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRA0 STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#110709; --card2:#1c0a0d; --line:#3a1217;
  --main:#b3001b; --main2:#e01e37; --text:#f6ecec; --muted:#a58b8e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}

header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:800;font-size:22px;letter-spacing:1px;color:var(--main2)}
.login{background:var(--main);color:#fff;padding:8px 18px;border-radius:12px;font-weight:600;font-size:14px;border:0;cursor:pointer;font-family:inherit}

.social{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.social a{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:.2s}
.social a svg{width:22px;height:22px}
.social a:hover{background:var(--main);transform:translateY(-2px)}

.hero{text-align:center;padding:14px 20px 8px}
.hero h1{font-size:18px;font-weight:600;color:var(--muted);line-height:1.8;letter-spacing:1px}
.hero h1 b{color:var(--main2)}

.wrap{max-width:900px;margin:0 auto;padding:12px 10px 40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.grid{gap:16px}}
.cat{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:18px;padding:14px 6px 12px;text-align:center;cursor:pointer;transition:.25s;overflow:hidden;
  min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cat:hover{transform:translateY(-4px);border-color:var(--main2);box-shadow:0 8px 24px rgba(224,30,55,.25)}
.cat .ico{width:92%;aspect-ratio:1/1;margin:0 auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:46px;background:linear-gradient(135deg,var(--main),#6d0010);overflow:hidden}
.cat .ico img{width:100%;height:100%;object-fit:cover}
.cat h3{font-size:14px;font-weight:800;line-height:1.5}
.cat.soon{opacity:.55;cursor:not-allowed}
.cat.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
.badge{position:absolute;top:6px;left:6px;background:var(--main2);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:7px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#070304;border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:700px;
  max-height:88vh;overflow-y:auto;padding:18px 16px 28px;animation:up .25s ease}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{font-size:20px}
.close{background:var(--card);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;margin-bottom:6px;text-align:center}
.items{display:grid;grid-template-columns:1fr;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.item .name{font-weight:600;font-size:15px}
.btns{display:flex;gap:6px}
.buy{border:0;padding:9px 12px;border-radius:12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:#fff}
.wa{background:var(--main)}
.tg{background:#2a2a2a;border:1px solid var(--line)}
.group{margin:16px 0 8px;font-weight:800;color:var(--main2);font-size:16px}

footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px 40px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<script>
const WA_NUMBER = "963936656311";
const TG_USER = "ULTRA_T_1";

/* لإضافة صورة لقسم: حط  img:"اسم-الصورة.png"  داخل القسم (بعد رفع الصورة للمستودع) */
const categories = [
  {name:"قسم الألعاب", icon:"🎮", groups:[
    {title:"PUBG Mobile", items:["UC 60","UC 325","UC 660"]},
    {title:"Free Fire", items:["110 جوهرة","583 جوهرة","1188 جوهرة"]}
  ]},
  {name:"قسم التطبيقات", icon:"📱", groups:[
    {title:"تطبيقات", items:["Bigo Live","TikTok Coins","Likee"]}
  ]},
  {name:"قسم الأرصدة", icon:"💰", soon:true},
  {name:"سوشيال ميديا", icon:"📣", groups:[
    {title:"خدمات", items:["متابعين انستغرام","لايكات تيك توك"]}
  ]},
  {name:"قسم البطاقات", icon:"💳", groups:[
    {title:"بطاقات", items:["فيزا افتراضية","Google Play","iTunes","Steam"]}
  ]},
  {name:"توثيق الحسابات", icon:"✅", groups:[
    {title:"توثيق", items:["توثيق انستغرام","توثيق تيك توك"]}
  ]},
  {name:"الحسابات الجاهزة", icon:"👤", groups:[
    {title:"حسابات", items:["حسابات ألعاب","حسابات سوشيال"]}
  ]},
  {name:"العملات الرقمية", icon:"🪙", groups:[
    {title:"عملات", items:["USDT","Bitcoin"]}
  ]},
  {name:"الذكاء الاصطناعي", icon:"🤖", groups:[
    {title:"اشتراكات", items:["ChatGPT Plus","Claude Pro","Gemini"]}
  ]},
  {name:"اشتراكات TV", icon:"📺", groups:[
    {title:"اشتراكات", items:["Netflix","Shahid VIP","IPTV"]}
  ]},
  {name:"اشتراكات VPN", icon:"🔒", groups:[
    {title:"اشتراكات", items:["NordVPN","ExpressVPN"]}
  ]},
  {name:"برامج التصميم", icon:"🖌️", groups:[
    {title:"برامج", items:["Canva Pro","Adobe","CapCut Pro"]}
  ]},
  {name:"قسم التصميم", icon:"🎨", groups:[
    {title:"خدمات", items:["تصميم شعار","تصميم بوستات"]}
  ]},
  {name:"قسم البرمجة", icon:"💻", groups:[
    {title:"خدمات", items:["تصميم موقع","بوت تيليجرام"]}
  ]},
  {name:"قسم الكوبونات", icon:"🎟️", groups:[
    {title:"كوبونات", items:["كوبونات خصم"]}
  ]}
];

const grid = document.getElementById("grid");
categories.forEach(c=>{
  const el = document.createElement("div");
  el.className = "cat" + (c.soon?" soon":"");
  el.innerHTML = (c.soon?'<span class="badge">قريباً</span>':'') +
    '<div class="ico">'+(c.img?'<img src="'+c.img+'" alt="">':c.icon)+'</div><h3>'+c.name+'</h3>';
  if(!c.soon) el.onclick = ()=>openSheet(c);
  grid.appendChild(el);
});

function openSheet(c){
  document.getElementById("sheetTitle").textContent = c.name;
  let html = '<div class="note">الأسعار تُرسل عبر واتساب أو تيليجرام</div>';
  c.groups.forEach(g=>{
    html += '<div class="group">'+g.title+'</div><div class="items">';
    g.items.forEach(n=>{
      const t = g.title+' - '+n;
      html += '<div class="item"><div class="name">'+n+'</div><div class="btns">'+
        '<button class="buy wa" onclick="orderWA(\''+t+'\')">واتساب</button>'+
        '<button class="buy tg" onclick="orderTG()">تيليجرام</button></div></div>';
    });
    html += '</div>';
  });
  document.getElementById("sheetBody").innerHTML = html;
  document.getElementById("overlay").classList.add("show");
}
function closeSheet(){document.getElementById("overlay").classList.remove("show")}
function orderWA(txt){
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent("مرحباً، أريد الاستفسار عن سعر: "+txt),"_blank");
}
function orderTG(){window.open("https://t.me/"+TG_USER,"_blank")}
</script>
