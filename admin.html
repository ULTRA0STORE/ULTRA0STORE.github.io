<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة | ULTRA0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--card:#110709;--line:#3a1217;--main:#b3001b;--main2:#e01e37;--text:#f6ecec;--muted:#a58b8e;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.box{max-width:760px;margin:0 auto}
h1{color:var(--main2);font-size:22px;margin:8px 0 14px}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--text);font-family:inherit;font-size:14px;margin-bottom:8px}
button{font-family:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--main);color:#fff;font-weight:700;cursor:pointer}
button.gray{background:#2a2a2a;border:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button{flex:1 1 auto;padding:9px 10px;font-size:13px;background:var(--card);border:1px solid var(--line)}.tabs button.on{background:var(--main)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}.err{color:var(--main2);min-height:20px;font-size:13px;margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.vip{display:inline-block;padding:1px 10px;border-radius:999px;background:linear-gradient(135deg,#ffe27a,#f2b500);color:#3a2a00;font-weight:800;font-size:12px}
</style>
</head>
<body><div class="box">
<h1>لوحة إدارة ULTRA0</h1>
<div id="login" style="display:none" class="card">
  <input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="email">
  <input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password">
  <div class="err" id="msg"></div>
  <button id="go" style="width:100%">دخول</button>
</div>
<div id="app" style="display:none">
  <div class="tabs"><button data-t="users" class="on">المستخدمون</button><button data-t="vip">VIP</button><button data-t="orders">الطلبات</button><button data-t="cats">الأقسام</button><button data-t="products">المنتجات</button><button data-t="sum">الملخص</button><button data-t="sup">المزوّد</button><button data-t="deps">الإيداعات</button></div>
  <div id="view"></div>
  <button class="gray" id="out" style="margin-top:10px">تسجيل الخروج</button>
</div>
</div>
<script>
const SB_URL="https://sbzdkuyxccfyvktjhdas.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiemRrdXl4Y2NmeXZrdGpoZGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTEzOTksImV4cCI6MjEwNzEyNzM5OX0.fuUbL4xWUndqylQXTJzCTXIY8Qd6V85pXvF40eJ5jYs";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST = {pending:"قيد التنفيذ", done:"تم", rejected:"مرفوض"};
let tabName = "users", usersCache = [], catsCache = [], levelsCache = [];
const resolveEmail = s => { s = String(s||"").trim().toLowerCase().replace(/^#/,""); if(/^\d+$/.test(s)){ const u = usersCache.find(x=>String(x.public_id)===s); return u ? u.email : ""; } return s; };
const orderTail = o => {
  const note = o.note ? '<div class="muted" dir="auto" style="'+(o.status==="pending"?'color:#ff8a8a':'')+'">'+esc(o.note)+'</div>' : '';
  if(o.status!=="pending") return note;
  const rej = '<button class="gray" data-o="'+o.id+'" data-s="rejected">رفض + استرجاع</button>';
  if(o.supplier_product_id) return o.note ? note+'<div style="margin-top:8px">'+rej+'</div>' : '<div class="muted">تلقائي: بانتظار المزوّد</div>';
  return '<div class="two" style="margin-top:8px"><button data-o="'+o.id+'" data-s="done">تم التنفيذ</button>'+rej+'</div>';
};
const pathOf = id => { const c = catsCache.find(x=>x.id==id); return c ? (c.parent_id ? pathOf(c.parent_id)+" > " : "")+c.name : ""; };
const catOpts = root => (root?'<option value="">قسم رئيسي (بدون أب)</option>':'<option value="">اختر القسم</option>')+catsCache.map(c=>'<option value="'+c.id+'">'+esc(pathOf(c.id))+'</option>').join("");

function show(w){ $("login").style.display = w==="login"?"block":"none"; $("app").style.display = w==="app"?"block":"none"; }
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return show("login");
  const {data} = await sb.from("profiles").select("is_admin").eq("id", session.user.id).single();
  if(!data || !data.is_admin){ await sb.auth.signOut(); $("msg").textContent = "هذا الحساب ليس أدمن"; return show("login"); }
  show("app"); render();
}
$("go").onclick = async ()=>{
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if(error){ $("msg").textContent = "البريد أو كلمة السر غير صحيحة"; return; }
  $("msg").textContent = ""; init();
};
$("out").onclick = async ()=>{ await sb.auth.signOut(); show("login"); };
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tabName = b.dataset.t;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
  render();
});
function fail(e){ alert("خطأ: " + (e.message||e)); }

async function render(){
  const v = $("view"); v.innerHTML = '<div class="muted">جاري التحميل...</div>';
  if(tabName==="users"){
    let pr = await sb.from("profiles").select("id,public_id,email,balance,is_admin").order("created_at",{ascending:false}).limit(300);
    if(pr.error) pr = await sb.from("profiles").select("id,email,balance,is_admin").order("created_at",{ascending:false}).limit(300);
    if(pr.error) return fail(pr.error);
    const [lv, uv] = await Promise.all([sb.from("vip_levels").select("id,name,percent").order("percent"), sb.from("user_vip").select("user_id,level_id")]);
    usersCache = pr.data; levelsCache = lv.data||[];
    const vm = {}; (uv.data||[]).forEach(x=>vm[x.user_id]=x.level_id);
    usersCache.forEach(u=>{ u.vip = levelsCache.find(x=>x.id===vm[u.id]) || null; });
    const levelOpts = levelsCache.length ? levelsCache.map(l=>'<option value="'+l.id+'">'+esc(l.name)+' — '+Number(l.percent)+'%</option>').join("") : '<option value="">أضف مستويات من تبويب VIP</option>';
    v.innerHTML = '<div class="card"><b>إضافة رصيد</b><input id="ue" dir="ltr" placeholder="ايميل الزبون أو رقم الحساب (ID)"><input id="ua" type="number" step="0.01" placeholder="المبلغ بالدولار (سالب للخصم)"><button id="uadd" style="width:100%">إضافة</button><div style="height:10px"></div><input id="upw" dir="ltr" placeholder="كلمة سر جديدة للزبون (6 أحرف على الأقل)"><button id="upass" class="gray" style="width:100%">تعيين كلمة السر</button></div>'+
      '<div class="card"><b>تفعيل VIP</b><div class="muted" style="margin-bottom:8px">اكتب الايميل أو رقم الحساب بالخانة فوق (أو اضغط على زبون من القائمة)</div><select id="vl">'+levelOpts+'</select><div class="two"><button id="vset">تفعيل</button><button id="vclr" class="gray">إلغاء VIP</button></div></div><input id="usr" placeholder="ابحث بالايميل أو رقم الحساب..."><div id="ulist"></div>';
    const draw = ()=>{
      const q = $("usr").value.trim().toLowerCase();
      $("ulist").innerHTML = usersCache.filter(u=>!q||u.email.includes(q)||String(u.public_id||"")===q.replace("#","")).map(u=>
        '<div class="card row" data-e="'+esc(u.email)+'" style="cursor:pointer"><span dir="ltr">'+(u.public_id?'<span class="muted">#'+u.public_id+'</span> ':'')+esc(u.email)+(u.is_admin?' ★':'')+'</span><span>'+(u.vip?'<span class="vip">'+esc(u.vip.name)+'</span> ':'')+'<b>'+Number(u.balance).toFixed(2)+' $</b></span></div>').join("") || '<div class="muted">لا يوجد</div>';
      $("ulist").querySelectorAll("[data-e]").forEach(c=>c.onclick=()=>{ $("ue").value = c.dataset.e; $("ua").focus(); });
    };
    $("usr").oninput = draw; draw();
    const setVip = async clear=>{
      const id = $("ue").value.trim().replace(/^#/,"");
      if(!id) return alert("اكتب الايميل أو رقم الحساب");
      const lvl = clear ? null : (+$("vl").value||0);
      if(!clear && !lvl) return alert("اختر المستوى");
      const {error} = await sb.rpc("admin_set_vip",{p_ident:id, p_level:lvl});
      if(error) return fail(error.message.includes("user_not_found") ? "الزبون غير موجود" : error);
      render();
    };
    $("vset").onclick = ()=>setVip(false); $("vclr").onclick = ()=>setVip(true);
    $("upass").onclick = async ()=>{
      const e = resolveEmail($("ue").value), p = $("upw").value;
      if(!e || p.length < 6) return alert("اكتب الايميل وكلمة سر من 6 أحرف أو أكثر");
      if(!confirm("تعيين كلمة سر جديدة للزبون "+e+" ؟")) return;
      const {data,error} = await sb.functions.invoke("sync",{body:{job:"setpass", email:e, password:p}});
      if(error || (data && data.error)) return alert("تعذّر: "+(data && data.error ? data.error : error.message));
      $("upw").value = ""; alert("تم تعيين كلمة السر. أرسلها للزبون.");
    };
    $("uadd").onclick = async ()=>{
      const a = parseFloat($("ua").value), em = resolveEmail($("ue").value);
      if(!em || !isFinite(a) || a===0) return alert("اكتب الايميل (أو رقم الحساب) والمبلغ");
      if(!confirm("إضافة "+a+" $ إلى "+em+" ؟")) return;
      const {error} = await sb.rpc("admin_add_balance",{p_email:em, p_amount:a});
      if(error) return fail(error.message==="user_not_found"?"الايميل غير موجود أو الرصيد يصير سالب":error);
      render();
    };
  }
  if(tabName==="vip"){
    const {data,error} = await sb.from("vip_levels").select("id,name,percent").order("percent");
    if(error) return fail(error);
    levelsCache = data;
    v.innerHTML = '<div class="card"><b>إضافة مستوى VIP</b><input id="vn" placeholder="اسم المستوى (مثلا VIP1)"><input id="vp" type="number" step="0.1" min="0" max="100" placeholder="نسبة الخصم % (مثلا 1 أو 2)"><button id="vadd" style="width:100%">حفظ</button></div>'+
      (data.map(l=>'<div class="card row"><div><span class="vip">'+esc(l.name)+'</span> <b>'+Number(l.percent)+'%</b></div><div><button class="gray" data-ve="'+l.id+'">تعديل النسبة</button> <button class="gray" data-vd="'+l.id+'">حذف</button></div></div>').join("") || '<div class="muted">لا يوجد مستويات</div>')+
      '<div class="muted">النسبة بتنطبق تلقائياً على كل مشتريات الزبون. لتفعيل VIP لزبون روح لتبويب المستخدمون.</div>';
    $("vadd").onclick = async ()=>{
      const n = $("vn").value.trim(), p = parseFloat($("vp").value);
      if(!n || !isFinite(p) || p<0 || p>100) return alert("اكتب الاسم ونسبة بين 0 و 100");
      const {error} = await sb.rpc("admin_save_vip_level",{p_id:null, p_name:n, p_percent:p});
      if(error) return fail(error.message.includes("duplicate") ? "الاسم موجود مسبقاً" : error); render();
    };
    v.querySelectorAll("[data-ve]").forEach(b=>b.onclick=async()=>{
      const l = levelsCache.find(x=>x.id==b.dataset.ve), s = prompt("نسبة الخصم الجديدة لـ "+l.name+" (%)", l.percent); if(s===null) return;
      const p = parseFloat(s); if(!isFinite(p) || p<0 || p>100) return alert("نسبة غير صالحة");
      const {error} = await sb.rpc("admin_save_vip_level",{p_id:l.id, p_name:l.name, p_percent:p});
      if(error) return fail(error); render();
    });
    v.querySelectorAll("[data-vd]").forEach(b=>b.onclick=async()=>{
      if(!confirm("حذف المستوى؟ الزبائن اللي عليه بيرجعوا عاديين.")) return;
      const {error} = await sb.rpc("admin_delete_vip_level",{p_id:+b.dataset.vd});
      if(error) return fail(error); render();
    });
  }
  if(tabName==="orders"){
    const {data,error} = await sb.from("orders").select("id,game,product_name,price,player_id,status,created_at,supplier_product_id,note,profiles(email)").order("id",{ascending:false}).limit(100);
    if(error) return fail(error);
    v.innerHTML = data.map(o=>
      '<div class="card"><div class="row"><b>#'+o.id+' — '+esc(o.product_name)+'</b><span class="st">'+ST[o.status]+'</span></div>'+
      '<div class="muted">'+esc(o.game)+' • '+Number(o.price).toFixed(2)+' $ • <span dir="ltr">'+esc(o.profiles&&o.profiles.email)+'</span></div>'+
      '<div class="muted">ID اللاعب: <b dir="ltr">'+esc(o.player_id||"-")+'</b> • '+new Date(o.created_at).toLocaleString("ar")+'</div>'+
      orderTail(o)+'</div>').join("") || '<div class="muted">لا توجد طلبات</div>';
    v.querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{
      if(b.dataset.s==="rejected" && !confirm("رفض الطلب وإرجاع الرصيد؟")) return;
      const {error} = await sb.rpc("admin_set_order",{p_order:+b.dataset.o, p_status:b.dataset.s});
      if(error) return fail(error); render();
    });
  }
  if(tabName==="sup"){
    const {data} = await sb.from("settings").select("value").eq("key","margin").maybeSingle();
    const gs = await sb.functions.invoke("sync",{body:{job:"getsupplier"}});
    const curUrl = gs.data && gs.data.url ? gs.data.url : "";
    v.innerHTML = '<div class="card"><b>ربط المزوّد</b><div class="muted">المزوّد الحالي: <span dir="ltr">'+esc(curUrl||"غير معروف")+'</span></div><input id="su" dir="ltr" placeholder="رابط الـ API مثل https://api.example.com" value="'+esc(curUrl)+'"><input id="st" type="password" dir="ltr" autocomplete="off" placeholder="مفتاح الـ API (اتركه فاضي للإبقاء على الحالي)"><button id="stest" class="gray" style="width:100%">اختبار الاتصال</button><div style="height:8px"></div><button id="ssave" style="width:100%">حفظ وتبديل المزوّد</button><div class="muted" id="smsg" style="margin-top:8px"></div></div><div class="card"><b>نسبة الربح %</b><input id="mg" type="number" step="0.1" value="'+(data?data.value:10)+'"><button id="mgs" style="width:100%">حفظ النسبة</button></div><div class="card"><button id="s1" style="width:100%">تحديث الأقسام والمنتجات من المزوّد</button><div style="height:8px"></div><button id="s2" class="gray" style="width:100%">فحص الطلبات الآن</button><div id="sres" class="muted" style="margin-top:8px"></div></div>';
    $("mgs").onclick = async ()=>{ const {error} = await sb.from("settings").upsert({key:"margin", value:String(+$("mg").value||0)}); if(error) return fail(error); alert("تم الحفظ، بتطبق عند التحديث القادم"); };
    const run = async (job,btn)=>{ btn.disabled = true; $("sres").textContent = "جاري التنفيذ..."; const {data,error} = await sb.functions.invoke("sync",{body:{job}}); btn.disabled = false; $("sres").textContent = error ? ("خطأ: "+error.message) : JSON.stringify(data); };
    $("s1").onclick = ()=>run("products",$("s1")); $("s2").onclick = ()=>run("orders",$("s2"));
    const call = async (job, extra)=>{ const r = await sb.functions.invoke("sync",{body:Object.assign({job}, extra)}); return r.error ? {error:r.error.message} : (r.data||{}); };
    const vals = ()=>({url:$("su").value.trim(), token:$("st").value.trim()});
    $("stest").onclick = async ()=>{ $("smsg").textContent = "جاري الاختبار..."; const r = await call("testsupplier", vals()); $("smsg").textContent = r.error ? "فشل: "+r.error : "نجح الاتصال. رصيدك عنده: "+r.balance+" "+(r.currency||""); };
    $("ssave").onclick = async ()=>{
      const v2 = vals(); let same = false;
      try{ same = new URL(v2.url).host === new URL(curUrl).host; }catch(e){}
      if(!confirm(same ? "حفظ إعدادات المزوّد؟" : "تبديل المزوّد؟ سيتم مسح أقسام ومنتجات المزوّد القديم وتحميل الجديد (الطلبات القديمة بتبقى).")) return;
      $("smsg").textContent = "جاري الحفظ...";
      const r = await call("setsupplier", v2);
      if(r.error){ $("smsg").textContent = r.error==="pending_orders" ? "في طلبات معلّقة ("+r.pending+")، انتظر لحد ما تنتهي وبعدين بدّل" : "فشل: "+r.error; return; }
      $("st").value = ""; $("smsg").textContent = "تم الحفظ"+(r.changed ? " ومسح بيانات المزوّد القديم" : "")+". اضغط تحديث الأقسام والمنتجات.";
    };
  }
  if(tabName==="deps"){
    const [r, rt] = await Promise.all([
      sb.from("deposits").select("id,amount_syp,amount_usd,status,tx_ref,proof_url,created_at,profiles(email),deposit_methods(name)").order("id",{ascending:false}).limit(60),
      sb.from("settings").select("value").eq("key","syp_rate").maybeSingle()
    ]);
    if(r.error) return fail(r.error);
    const L = {pending:"بانتظار تحويل الزبون", review:"بانتظار المراجعة", done:"مقبول", rejected:"مرفوض", cancelled:"ملغاة", expired:"منتهية"};
    v.innerHTML = '<div class="card"><b>سعر الصرف (ل.س مقابل 1$)</b><input id="rt" type="number" step="0.01" value="'+(rt.data?rt.data.value:147)+'"><button id="rts" style="width:100%">حفظ السعر</button></div>'+
      (r.data.length ? r.data.map(d=>'<div class="card"><b>#'+d.id+' — '+esc(d.deposit_methods?d.deposit_methods.name:"")+'</b> <span class="muted">'+L[d.status]+'</span><div class="muted">'+esc(d.profiles?d.profiles.email:"")+' • '+Number(d.amount_syp)+' SYP = $'+Number(d.amount_usd).toFixed(3)+'</div><div class="muted" dir="auto">رقم العملية: '+esc(d.tx_ref||"—")+' • '+new Date(d.created_at).toLocaleString("ar")+'</div>'+(d.proof_url?'<div style="margin-top:8px"><button class="gray" data-p="'+esc(d.proof_url)+'">عرض إثبات الدفع</button></div>':'')+(d.status==="review"?'<div class="two" style="margin-top:8px"><button data-d="'+d.id+'" data-s="done">قبول + إضافة الرصيد</button><button class="gray" data-d="'+d.id+'" data-s="rejected">رفض</button></div>':'')+'</div>').join("") : '<div class="muted">لا يوجد طلبات إيداع بعد</div>');
    $("rts").onclick = async ()=>{ const {error} = await sb.from("settings").upsert({key:"syp_rate", value:String(+$("rt").value||147)}); if(error) return fail(error); alert("تم حفظ سعر الصرف"); };
    v.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{
      const {data,error} = await sb.storage.from("proofs").createSignedUrl(b.dataset.p, 300);
      if(error) return fail(error); window.open(data.signedUrl, "_blank");
    });
    v.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
      if(b.dataset.s==="done" && !confirm("تأكدت إنو التحويل وصل لحسابك؟ سيضاف الرصيد للزبون.")) return;
      const {error} = await sb.rpc("admin_set_deposit", {p_id:+b.dataset.d, p_status:b.dataset.s});
      if(error) return fail(error); render();
    });
  }
  if(tabName==="sum"){
    const since = new Date(Date.now()-30*86400000);
    const [o, st] = await Promise.all([
      sb.from("orders").select("price,qty,status,created_at,products(supplier_price)").gte("created_at",since.toISOString()).limit(5000),
      sb.from("settings").select("key,value").in("key",["supplier_balance","supplier_balance_at","low_balance"])
    ]);
    if(o.error) return fail(o.error);
    const S = {}; (st.data||[]).forEach(x=>S[x.key]=x.value);
    const bal = S.supplier_balance!=null ? parseFloat(S.supplier_balance) : null, th = parseFloat(S.low_balance!=null?S.low_balance:"5");
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const per = from=>{ const r = {n:0,sales:0,profit:0}; (o.data||[]).forEach(x=>{ if(new Date(x.created_at) < from) return; r.n++; if(x.status==="done"){ const p = Number(x.price)||0; r.sales += p; const sp = x.products && x.products.supplier_price!=null ? Number(x.products.supplier_price)*(x.qty||1) : null; if(sp!=null) r.profit += p-sp; } }); return r; };
    const rows = [["اليوم",per(t0)],["آخر 7 أيام",per(new Date(Date.now()-7*86400000))],["آخر 30 يوم",per(since)]];
    v.innerHTML = '<div class="card"><b>رصيدك عند المزوّد</b><div style="font-size:32px;font-weight:900;margin:6px 0;color:'+(bal!=null && bal<th ? '#ff6b6b' : '#10d98a')+'">'+(bal!=null ? '$'+bal.toFixed(2) : '—')+'</div><div class="muted">'+(S.supplier_balance_at ? 'آخر تحديث: '+new Date(S.supplier_balance_at).toLocaleString("ar") : 'لم يتم التحديث بعد')+'</div><div style="height:8px"></div><button id="bref" style="width:100%">تحديث الرصيد الآن</button><div class="muted" id="bmsg"></div></div>'+
      '<div class="card"><b>حد التنبيه ($)</b><input id="bth" type="number" step="0.5" value="'+th+'"><button id="bths" class="gray" style="width:100%">حفظ الحد</button><div class="muted">بيوصلك تنبيه تيليجرام إذا نزل رصيدك عند المزوّد عن هالمبلغ</div></div>'+
      rows.map(r=>'<div class="card"><b>'+r[0]+'</b><div class="muted">الطلبات: '+r[1].n+' • المبيعات: $'+r[1].sales.toFixed(2)+' • الربح التقريبي: $'+r[1].profit.toFixed(2)+'</div></div>').join("")+
      '<div class="muted">الربح التقريبي بيحسب من الطلبات المنفّذة اللي إلها سعر مزوّد.</div>';
    $("bref").onclick = async ()=>{ $("bmsg").textContent = "جاري التحديث..."; const {data,error} = await sb.functions.invoke("sync",{body:{job:"balance"}}); if(error || (data && data.error)) { $("bmsg").textContent = "تعذّر: "+(data && data.error ? data.error : error.message); return; } render(); };
    $("bths").onclick = async ()=>{ const {error} = await sb.from("settings").upsert({key:"low_balance", value:String(+$("bth").value||5)}); if(error) return fail(error); alert("تم حفظ الحد"); };
  }
  if(tabName==="cats"){
    const {data,error} = await sb.from("categories").select("*").order("sort").order("id");
    if(error) return fail(error);
    catsCache = data;
    v.innerHTML = '<div class="card"><b>إضافة قسم</b><select id="cp">'+catOpts(true)+'</select><input id="cn" placeholder="اسم القسم"><input id="ci" dir="ltr" placeholder="رابط الصورة (اختياري)"><button id="cadd" style="width:100%">إضافة</button></div>'+
      data.map(c=>'<div class="card row"><div><b>'+esc(pathOf(c.id))+'</b>'+(c.active?'':'<div class="muted">مخفي</div>')+'</div><div><button class="gray" data-ci="'+c.id+'">صورة</button> <button class="gray" data-ct="'+c.id+'" data-a="'+c.active+'">'+(c.active?'إخفاء':'إظهار')+'</button> <button class="gray" data-cd="'+c.id+'">حذف</button></div></div>').join("");
    $("cadd").onclick = async ()=>{
      if(!$("cn").value.trim()) return alert("اكتب اسم القسم");
      const {error} = await sb.from("categories").insert({parent_id:$("cp").value||null, name:$("cn").value.trim(), image:$("ci").value.trim()||null});
      if(error) return fail(error); render();
    };
    v.querySelectorAll("[data-ct]").forEach(b=>b.onclick=async()=>{
      const {error} = await sb.from("categories").update({active: b.dataset.a!=="true"}).eq("id", b.dataset.ct);
      if(error) return fail(error); render();
    });
    v.querySelectorAll("[data-ci]").forEach(b=>b.onclick=async()=>{
      const u = prompt("الصق رابط الصورة (فاضي = حذف الصورة)"); if(u===null) return;
      const {error} = await sb.from("categories").update({image:u.trim()||null}).eq("id", b.dataset.ci);
      if(error) return fail(error); render();
    });
    v.querySelectorAll("[data-cd]").forEach(b=>b.onclick=async()=>{
      if(!confirm("حذف القسم وكل الأقسام اللي تحته؟")) return;
      const {error} = await sb.from("categories").delete().eq("id", b.dataset.cd);
      if(error) return fail(error); render();
    });
  }
  if(tabName==="products"){
    const cr = await sb.from("categories").select("*").order("sort").order("id"); catsCache = cr.data||[];
    const {data,error} = await sb.from("products").select("*").order("game").order("sort");
    if(error) return fail(error);
    v.innerHTML = '<div class="card"><b>إضافة منتج</b><select id="pg">'+catOpts(false)+'</select><input id="pn" placeholder="اسم المنتج (مثلا: 60 UC)"><input id="pp" type="number" step="0.01" placeholder="السعر بالدولار"><button id="padd" style="width:100%">إضافة</button></div>'+
      data.map(p=>'<div class="card row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(pathOf(p.category_id)||p.game)+' • '+Number(p.price).toFixed(2)+' $'+(p.active?'':' • مخفي')+'</div></div>'+
      '<div><button class="gray" data-t="'+p.id+'" data-a="'+p.active+'">'+(p.active?'إخفاء':'إظهار')+'</button> <button class="gray" data-d="'+p.id+'">حذف</button></div></div>').join("");
    $("padd").onclick = async ()=>{
      const price = parseFloat($("pp").value);
      if(!$("pg").value || !$("pn").value.trim() || !isFinite(price)) return alert("عبّي كل الخانات");
      const {error} = await sb.from("products").insert({category_id:+$("pg").value, game:(catsCache.find(c=>c.id==$("pg").value)||{}).name, name:$("pn").value.trim(), price});
      if(error) return fail(error); render();
    };
    v.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{
      const {error} = await sb.from("products").update({active: b.dataset.a!=="true"}).eq("id", b.dataset.t);
      if(error) return fail(error); render();
    });
    v.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
      if(!confirm("حذف المنتج؟")) return;
      const {error} = await sb.from("products").delete().eq("id", b.dataset.d);
      if(error) return fail(error); render();
    });
  }
}
init();

/* تبويب إعلان المتجر */
(function(){
const bar=document.querySelector(".tabs"), nb=document.createElement("button"); nb.dataset.t="ann"; nb.textContent="الإعلان"; bar.appendChild(nb);
nb.onclick=()=>{ tabName="ann"; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===nb)); render(); };
document.querySelectorAll(".tabs button").forEach(b=>{ if(b!==nb) b.addEventListener("click",()=>{}); });
const _r=render;
render=async function(){
  if(tabName!=="ann") return _r();
  const v=$("view"); const {data}=await sb.from("settings").select("value").eq("key","announcement").maybeSingle();
  v.innerHTML='<div class="card"><b>نص الشريط المتحرك بالموقع</b><input id="an" value="'+esc(data?data.value:"")+'" placeholder="اكتب الإعلان (فاضي = النص الافتراضي)"><button id="ans" style="width:100%">حفظ</button></div>';
  $("ans").onclick=async()=>{ const {error}=await sb.from("settings").upsert({key:"announcement",value:$("an").value.trim()}); if(error) return fail(error); alert("تم الحفظ"); };
};
})();

/* تبويب نوع الإدخال */
(function(){
const nb = document.createElement("button"); nb.textContent = "نوع الإدخال"; document.querySelector(".tabs").appendChild(nb);
nb.onclick = ()=>{ tabName = "inp"; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===nb)); render(); };
const _r = render;
render = async function(){
  if(tabName!=="inp") return _r();
  const v = $("view"); v.innerHTML = '<div class="muted">جاري التحميل...</div>';
  const [c,s] = await Promise.all([sb.from("categories").select("id,parent_id,name").order("sort").order("id"), sb.from("settings").select("value").eq("key","input_types").maybeSingle()]);
  if(c.error) return fail(c.error); catsCache = c.data; let M = {}; try{ M = JSON.parse(s.data.value)||{}; }catch(e){}
  const O = [["","تلقائي"],["id","رقم اللاعب (ID)"],["link","رابط"],["phone","رقم هاتف"],["none","بدون إدخال"]];
  v.innerHTML = '<div class="muted" style="margin-bottom:8px">حدّد شو بيُطلب من الزبون عند الشراء. الاختيار بينطبق على الأقسام اللي تحته كمان. «تلقائي» = النظام بيخمّن.</div><input id="ifl" placeholder="بحث عن قسم..."><div id="il"></div>';
  const draw = ()=>{ const q = $("ifl").value.trim().toLowerCase();
    $("il").innerHTML = catsCache.filter(x=>!q||pathOf(x.id).toLowerCase().includes(q)).slice(0,80).map(x=>'<div class="card row"><span>'+esc(pathOf(x.id))+'</span><select data-c="'+x.id+'" style="width:auto;margin:0">'+O.map(o=>'<option value="'+o[0]+'"'+((M[x.id]||"")==o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>').join("");
    $("il").querySelectorAll("select").forEach(se=>se.onchange = async ()=>{ if(se.value) M[se.dataset.c] = se.value; else delete M[se.dataset.c]; const {error} = await sb.from("settings").upsert({key:"input_types",value:JSON.stringify(M)}); if(error) fail(error); }); };
  $("ifl").oninput = draw; draw();
};
})();
</script>
</body>
